# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# 뭉치장 CodeRabbit 설정
# 팀 리뷰 기준은 이 파일의 path_instructions에 모두 담습니다.
language: ko-KR
tone_instructions: '한국어로 간결하게 리뷰합니다. 실제 버그·규칙 위반·접근성 문제를 우선 지적하고, 취향 수준의 제안은 nitpick으로만 남깁니다.'
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  # PR 템플릿으로 쓴 본문을 덮어쓰지 않도록 요약은 walkthrough 코멘트에만 남깁니다.
  high_level_summary_in_walkthrough: true
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  auto_review:
    enabled: true
    drafts: false
    # 기본 브랜치(develop) 대상 PR만 리뷰합니다. develop -> main 최신화 PR은 이미 리뷰된 변경이라 제외합니다.
    # CI가 만드는 Orval 자동 생성 PR은 리뷰하지 않습니다.
    ignore_title_keywords:
      - 'Orval 자동 코드 생성'

  path_filters:
    - '!packages/api-client/src/generated/**'
    - '!packages/api-client/src/hooks/**'
    - '!packages/api-client/src/zod/**'
    - '!packages/api-client/src/mock-data/**'
    - '!pnpm-lock.yaml'
    - '!**/storybook-static/**'
    - '!apps/web/src/stories/**'

  path_instructions:
    - path: '**/*.{ts,tsx}'
      instructions: |
        [코드 품질]
        - YAGNI: 요청 범위를 넘는 기능, 한 번만 쓰는 추상화, 쓰이지 않는 설정 가능성을 지적합니다.
        - PR 목적과 무관한 리팩터링·정리가 섞였으면 분리를 권합니다.
        - 이번 변경으로 unused가 된 import·변수·함수가 남아 있으면 지적합니다.
        - 불필요한 `any`를 금지합니다. 형태를 모르면 `unknown`을 씁니다.
        - API 응답 타입은 수동으로 모델링하지 않고 `@moongchijang/api-client/generated/api.schemas`의 Orval 타입을 씁니다.
        - 파일명: 컴포넌트 PascalCase, 훅 `use` 접두사 camelCase, 유틸·상수·스키마 camelCase.

        [아키텍처]
        - `packages/*`에서 `apps/*`를 import하는 역방향 의존은 금지입니다.
        - `src/services`, `src/views`, `src/routes`, `src/api` 같은 새 레이어를 만들지 않습니다.
        - `apps/web` 내부는 `@/` alias, 같은 디렉터리는 `./` 상대 경로를 씁니다.
        - `@moongchijang/api-client`는 경로 없이 import하지 않고 하위 경로(`/hooks/<tag>/<tag>`, `/generated/api.schemas`, `/fetcher` 등)로 import합니다.
        - 미들웨어 로직은 `apps/web/src/proxy.ts`에 둡니다. `middleware.ts`를 새로 만들면 지적합니다.

        [데이터 패칭]
        - 서버 데이터를 `useState + useEffect`로 직접 패칭하지 않고 Orval 생성 React Query 훅을 씁니다.
        - 서버 데이터를 Zustand에 복제하지 않습니다. Zustand는 순수 클라이언트 UI 상태 전용입니다.
        - mutation 성공 후 관련 쿼리 `invalidateQueries`가 빠졌는지 확인합니다.
        - 서버 컴포넌트에서 토큰 refresh를 직접 호출하면 안 됩니다(refreshToken rotation). refresh는 `proxy.ts` 또는 Route Handler에서만 합니다.
        - 엔드포인트 경로나 응답 형태를 생성 코드 없이 손으로 추측해 작성했으면 지적합니다.

        [분석 이벤트]
        - 이벤트 로깅은 `apps/web/src/lib/analytics.ts`의 `logEvent`만 사용하고, `EventParams`에 정의된 이벤트만 보냅니다.

    - path: '**/*.tsx'
      instructions: |
        [디자인 가이드]
        - 색상은 `packages/ui/src/tokens.css`의 시맨틱 토큰을 우선합니다.
          예: `text-text-basic|subtle|tertiary|brand|error`, `bg-bg-white`, `bg-surface-*`, `border-border-*`, `text-icon-*`.
          `#hex`, `rgb()`, `text-[#...]`, `bg-[...]` 같은 임의 색상 하드코딩을 지적합니다. 시맨틱 토큰이 없을 때만 `primary-*`, `gray-*` 같은 팔레트 토큰을 허용합니다.
        - 타이포그래피는 토큰 유틸(`title-*`, `heading-*`, `body-*`, `caption-*`)을 우선하고, `text-[13px]` 같은 임의 크기나 font-weight 조합 하드코딩을 지적합니다.
        - 간격은 `g1`~`g12` 스페이싱 토큰(`gap-g4`, `px-g5` 등), 모서리는 `rounded-small|medium|large|xlarge|2xlarge|3xlarge|max` 토큰을 우선합니다. 임의값(`p-[13px]`)은 이유가 있을 때만 허용합니다.
        - 클래스 조건부 결합은 `cn()`을 씁니다. 템플릿 문자열로 클래스를 이어 붙이면 지적합니다.
        - 아이콘은 `@iconify/react`의 `<Icon icon="lucide:..." />`(lucide, material-symbols, mingcute)를 쓰고 SVG 파일을 새로 추가하지 않습니다. `apps/admin`은 `ADMIN_ICONS`에 등록 후 사용합니다.
        - (`apps/web` 한정) 모바일 컨테이너 최대 너비는 `max-w-110`(440px)입니다. 하단 GNB가 있는 화면은 `gnb-content`, 플로팅 버튼은 `gnb-floating-btn` 유틸을 씁니다.
        - 컴포넌트 계층: 기본 UI는 `packages/ui`(Button, Input), 여러 라우트 공통 UI는 `apps/web/src/components`, 한 라우트 전용은 `app/(pages)/*/_components/`에 둡니다. 이미 있는 `Button`, `Modal`, `BottomSheet`, `Chip`, `Badge`, `Toggle` 등을 재구현했으면 지적합니다.
        - 페이지 컴포넌트는 조합과 데이터 흐름에 집중하고 세부 UI는 `_components/`로 위임합니다.

        [접근성]
        - 클릭 가능한 요소는 `<button>`/`<a>`/`next/link`를 씁니다. `div`/`span`에 `onClick`만 붙였으면 지적합니다(키보드 접근 불가).
        - `<button>`에 `type`이 없으면 form 안에서 submit이 되므로 `type="button"` 누락을 확인합니다.
        - 아이콘만 있는 버튼·링크에는 `aria-label`이 필요합니다. 장식용 `<Icon>`은 `aria-hidden`을 권합니다.
        - `<img>`/`next/image`에는 의미 있는 `alt`가 필요하고, 장식 이미지는 `alt=""`입니다.
        - 입력 요소는 `<label>` 또는 `aria-label`로 이름이 있어야 하고, 에러 메시지는 `aria-invalid`/`aria-describedby`로 연결되는지 확인합니다.
        - 상태(선택, 마감, 에러 등)를 색상만으로 표현하지 않고 텍스트나 아이콘을 함께 씁니다. 토글·탭·칩은 `aria-pressed`/`aria-selected`/`aria-checked` 등 상태 속성을 확인합니다.
        - Modal·BottomSheet 같은 오버레이는 `role="dialog"` + `aria-modal`, 제목 연결, ESC 닫기, 포커스 이동·복귀를 확인합니다.
        - `outline-none`으로 포커스 표시를 지웠다면 `focus-visible` 대체 스타일이 있는지 확인합니다.
        - 토스트·동적 알림은 `role="status"` 또는 `aria-live`가 있는지 확인합니다.
        - heading 레벨을 건너뛰거나 의미 없이 쓰지 않는지 확인합니다.

    - path: '**/*.stories.tsx'
      instructions: |
        - 컴포넌트 옆에 co-locate되어 있어야 하며 Storybook 10(`@storybook/nextjs-vite`)에서 독립 렌더링되어야 합니다.
        - 주요 상태(기본, 비활성, 에러, 빈 상태 등)가 스토리로 표현되는지 확인합니다.

    - path: '**/*.test.{ts,tsx}'
      instructions: |
        - Vitest + React Testing Library 기준입니다. 역할·텍스트 기반 쿼리(`getByRole` 등)를 우선합니다.
        - snapshot만 있는 인터랙티브 UI 테스트, 구현 세부사항 복제, Tailwind 클래스 자체를 검증하는 테스트를 지적합니다.
        - loading/empty/error 상태가 있는 UI는 최소 하나 이상 검증하는지 확인합니다.
        - 네트워크 모킹은 MSW v2를 쓰고 `apps/web/mocks/handlers.ts`를 공유합니다.
        - `apps/web` 외 워크스페이스에는 test 러너가 없어 테스트 파일을 추가해도 실행되지 않습니다.

    - path: 'apps/web/src/schemas/**'
      instructions: |
        - React Hook Form + Zod 폼 스키마입니다. 에러 메시지는 스키마 레벨에서 선언하고 타입은 `z.infer`로 추출합니다.

    - path: 'packages/api-client/src/**'
      instructions: |
        - 수기 코드 영역입니다(`generated/`, `hooks/`, `zod/`는 생성물이라 리뷰 제외). 수기 Zod 스키마는 `src/schemas/`에 둡니다.
        - 토큰·쿠키·refresh 로직 변경은 보안 관점(토큰 노출, rotation 깨짐, 무한 refresh 루프)으로 꼼꼼히 봅니다.

    - path: 'packages/api-client/orval.config.ts'
      instructions: |
        - `customFetch` mutator 설정을 제거·변경하면 지적합니다. 생성 코드가 이 mutator를 통해 인증·refresh를 처리합니다.
        - 생성 결과가 기대와 다를 때는 생성물이 아니라 이 파일이나 `scripts/`를 고치는 것이 맞습니다.

    - path: 'packages/ui/src/**'
      instructions: |
        - 순수 Presentational 컴포넌트만 둡니다. 비즈니스 로직, API, `apps/*` 의존이 들어오면 지적합니다.

    - path: '{amplify.yml,.npmrc,apps/*/next.config.js,apps/*/package.json}'
      instructions: |
        Amplify SSR 배포가 깨져서 넣은 설정이 있습니다. 아래를 되돌리는 변경은 반드시 지적합니다.
        - `.npmrc`의 `node-linker=hoisted`
        - `apps/web/next.config.js`의 `output: 'standalone'`
        - `apps/*/package.json`의 `next`, `react`, `react-dom`은 `catalog:`가 아닌 리터럴 버전
        - `amplify.yml`의 `build` phase에 `cd ../..` 추가 금지
        - 두 개 이상 워크스페이스가 공유하는 다른 의존성은 `pnpm-workspace.yaml`의 `catalog:`로 관리합니다.

  pre_merge_checks:
    docstrings:
      mode: 'off'
    title:
      mode: warning
      requirements: '`[MCJ-<번호>] <type>: <한국어 요약>` 형식이어야 합니다. type은 feat, mod, add, chore, del, ui, fix, move, rename, refactor, docs 중 하나입니다.'

  tools:
    # 프로젝트 ESLint/Prettier와 규칙이 달라 잡음만 만드는 린터는 끕니다.
    biome:
      enabled: false
    oxc:
      enabled: false
    languagetool:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - docs/**/*.md
