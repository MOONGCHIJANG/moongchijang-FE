name: Chromatic

on:
  push:
    branches:
      - main
      - develop # develop 브랜치 merge 시에도 배포

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0 # 시각적 변경사항 비교를 위해 전체 히스토리 필요

      # pnpm 버전은 루트 package.json의 packageManager 필드에서 자동 인식
      - uses: pnpm/action-setup@v4.1.0

      # Node 버전은 .nvmrc에서 자동 인식
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Publish to Chromatic
        working-directory: apps/web
        run: pnpm exec chromatic --project-token=${{ secrets.CHROMATIC_PROJECT_TOKEN }} --auto-accept-changes
