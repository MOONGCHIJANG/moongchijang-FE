version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Node 버전은 .nvmrc, pnpm 버전은 package.json의 packageManager 필드에서 읽는다
        - nvm use
        - export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        # .nvmrc가 floating '22'라 Amplify가 주는 22.x 패치 버전이 고정되지 않는다.
        # 22.14 미만 Node는 npm 서명키가 오래돼 pnpm 다운로드가 'Cannot find matching
        # keyid'로 실패하므로 서명 검증을 끈다. 직전 방식(npm install -g pnpm@10)도
        # 서명 검증이 없었으므로 신뢰 수준은 동일하다(레지스트리 + TLS).
        - export COREPACK_INTEGRITY_KEYS=0
        # pnpm만 지정: 인자 없이 enable하면 npm/yarn 심까지 깔려, packageManager가
        # pnpm으로 강제된 상태에서 레포 내 npm/npx 호출이 전부 거부된다.
        - corepack enable pnpm
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm turbo run build --filter=@moongchijang/web
  artifacts:
    baseDirectory: apps/web/.next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - apps/web/node_modules/**/*
      - apps/web/.next/cache/**/*
      # corepack이 받아온 pnpm 바이너리. 캐싱하지 않으면 배포마다 레지스트리
      # 다운로드에 의존하게 된다.
      - ~/.cache/node/corepack/**/*
